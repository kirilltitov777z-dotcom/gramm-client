name: 🔨 Build & Typecheck

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install
        run: npm install --no-audit --no-fund
      - name: 🔍 Typecheck
        run: npm run typecheck
      - name: 🏗 Build
        run: npm run build
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramm-web
          path: dist
          retention-days: 14
