name: 🌐 Refresh MTProto proxies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔄 Fetch & validate proxies
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, socket
          sources = [
            'https://raw.githubusercontent.com/gramm-app/proxies/main/proxies.json',
          ]
          out = []
          for url in sources:
            try:
              txt = urllib.request.urlopen(url, timeout=10).read().decode()
              out += json.loads(txt)
            except Exception as e:
              print('skip', url, e)
          # дедупликация
          seen, clean = set(), []
          for p in out:
            k = f"{p.get('host')}:{p.get('port')}"
            if k not in seen:
              seen.add(k); clean.append(p)
          with open('public/proxies.json', 'w') as f:
            json.dump(clean, f, indent=2); f.write('\n')
          print('proxies:', len(clean))
          PY

      - name: 💾 Commit if changed
        run: |
          git config user.name "gramm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/proxies.json
          git diff --staged --quiet || git commit -m "chore: refresh MTProto proxies"
          git push
